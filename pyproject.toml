[build-system]
requires = ["setuptools==77.0.3", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-content"
version = "0.4.0"
description = "Pinned user-level content catalog and installer for Kilix"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "itsmygithubacct", email = "itsmygithubacct@users.noreply.github.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema[format]==4.26.0",
]

[dependency-groups]
build = [
  "build==1.3.0",
  "setuptools==77.0.3",
  "wheel==0.45.1",
]
test = [
  "ruff==0.12.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kilix_content = ["catalog/*.json", "catalog/u1/*.json", "contracts/*.json", "contracts/u1/*.json", "licenses/*.json", "licenses/*.txt", "py.typed"]

[tool.setuptools.data-files]
"share/kilix-content/contracts" = ["contracts/*.schema.json", "contracts/kilix.content.u1-resources-v1.json"]
"share/kilix-content/contracts/u1" = ["contracts/u1/*.schema.json"]
"share/kilix-content/catalog/u1" = ["catalog/u1/*.json"]
"share/kilix-content/licenses" = ["licenses/*.json"]
